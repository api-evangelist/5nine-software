name: 5Nine Software
description: '5nine Software, Inc. was a US-based cybersecurity and cloud-management
  company that built the leading management and security platform for Microsoft Hyper-V
  and Microsoft Azure environments, letting managed service providers monitor and
  manage on-premises Hyper-V clusters and Azure instances from a single console. The
  company was backed by Insight Partners and was acquired by Acronis in December 2019,
  after which its technology was folded into the Acronis Cyber Platform and is now
  offered as Acronis Cloud Manager. 5nine no longer operates as an independent vendor:
  its domain (5nine.com) permanently redirects to the Acronis Cloud Manager product
  page and it publishes no standalone developer portal, API, or SDKs.'
